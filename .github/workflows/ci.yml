name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commits, since a tag can be moved to other code.
jobs:
  lint:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
      # The OpenCode plugin tests load the plugin with Bun, as OpenCode does.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: go test -race ./...

  # Clones need Btrfs or XFS, so the tests run on a loop device. The runner's
  # own ext4 disk is where the copy mode and refusal tests run.
  test-linux:
    strategy:
      matrix:
        filesystem: [btrfs, xfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
      - name: Mount a ${{ matrix.filesystem }} volume
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq btrfs-progs xfsprogs
          truncate -s 2G "$RUNNER_TEMP/volume.img"
          sudo mkfs.${{ matrix.filesystem }} -q "$RUNNER_TEMP/volume.img"
          sudo mkdir -p /mnt/volume
          sudo mount -o loop "$RUNNER_TEMP/volume.img" /mnt/volume
          sudo chown "$USER" /mnt/volume
          mkdir /mnt/volume/tmp "$RUNNER_TEMP/plain"
      - run: go test -race ./...
        env:
          TMPDIR: /mnt/volume/tmp
          UNDO_TEST_PLAIN_DIR: ${{ runner.temp }}/plain

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
