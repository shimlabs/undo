version: 2

builds:
  # FSEvents needs cgo, so macOS builds run on a macOS machine.
  - id: darwin
    main: &main ./cmd/undo
    binary: &binary undo
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: &goarch [amd64, arm64]
    ldflags: &ldflags
      - -s -w -X github.com/shimlabs/undo/internal/cli.Version={{ .Version }}
  - id: linux
    main: *main
    binary: *binary
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: *goarch
    ldflags: *ldflags

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^test"

homebrew_casks:
  - name: undo
    repository:
      owner: shimlabs
      name: homebrew-tap
      git:
        url: git@github.com:shimlabs/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    homepage: https://github.com/shimlabs/undo
    description: Undo anything a coding agent does to your project
    license: MIT
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/undo"]
          end
