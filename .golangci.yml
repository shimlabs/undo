version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: US
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
